name: Verify & publish Nuvio2Fusion

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check conversion, API and browser script
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
          node --check app/static/js/fusion.js
          git diff --check

  publish:
    name: Build and publish container
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Nuvio2Fusion
            org.opencontainers.image.description=Offline Nuvio collections to Fusion widget converter
      - name: Build and publish Linux images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the published container starts and converts
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          docker compose -f docker-compose.release.yml config --quiet
          docker run --detach --name nuvio2fusion-smoke --publish 127.0.0.1:7088:7088 "$RELEASE_IMAGE"
          test "$(docker inspect --format '{{.Config.User}}' nuvio2fusion-smoke)" = nuvio2fusion
          python scripts/smoke_container.py http://127.0.0.1:7088
      - name: Container smoke-test logs and cleanup
        if: always()
        run: |
          docker logs nuvio2fusion-smoke 2>/dev/null || true
          docker rm --force nuvio2fusion-smoke 2>/dev/null || true
